html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);
  padding-block:10px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{display:flex;flex-direction:column;gap:10px;max-width:1600px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
h1{font:600 17px/1 var(--sans);margin:0;letter-spacing:.01em}
.verTag{font:400 11px var(--mono);color:var(--dim,inherit);opacity:.65;margin-left:2px;vertical-align:middle;cursor:default}
.verTag:hover{opacity:1}
.chlog{max-width:70ch}.chEntry{padding:10px 0;border-bottom:1px solid var(--line)}.chEntry:last-child{border-bottom:0}
.chV{font:600 14px var(--mono);margin-bottom:4px}.chD{font:400 12px var(--sans);color:var(--dim,inherit);margin-left:10px;font-weight:400}
.chEntry ul{margin:2px 0 0;padding-left:20px}.chEntry li{margin:2px 0;font:13px var(--sans)}
h1 span{color:var(--accent)}
.song{display:flex;flex-direction:column;min-width:0}
.song b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song small{color:var(--dim)}
.grow{flex:1 1 auto}
.btn{font:500 13px var(--sans);background:var(--panel2);color:var(--fg);border:1px solid var(--line2);padding:6px 11px;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn.on{border-color:var(--play);color:var(--play)}
.btn[disabled]{opacity:.4;cursor:default}
.ctl{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12.5px}
.ctl select,.ctl input[type=range]{accent-color:var(--accent)}
select{font:13px var(--sans);background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:4px;padding:4px 6px}
.pos{font:500 13px var(--mono);color:var(--play);min-width:23ch;font-variant-numeric:tabular-nums}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
#ovStrip{display:block;width:100%;height:46px;cursor:pointer;touch-action:none}

#detailWrap{position:relative;height:420px;overflow-x:auto;overflow-y:hidden}
#dspacer{position:absolute;top:0;left:0;height:1px;pointer-events:none}
#detail{position:sticky;left:0;display:block;touch-action:none}
.seg{display:inline-flex}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:4px 0 0 4px}.seg .btn:last-child{border-radius:0 4px 4px 0;margin-left:-1px}
.seg .btn.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.bar2{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--dim);flex-wrap:wrap}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 6px;flex-wrap:wrap}
.tab{font:500 13px var(--sans);background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:8px 10px;cursor:pointer}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.pane{padding:12px 14px;overflow:auto;height:60vh;box-sizing:border-box}

.zoomTools{display:inline-flex;gap:12px;align-items:center;white-space:nowrap}.zoomTools .ctl{white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.mdlBack{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}.mdl{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;max-width:1000px;width:100%;max-height:92vh;overflow:auto;padding:14px 16px;font:13px var(--sans)}.mdl h3{margin:0 0 8px;font-size:16px}.mdl table{border-collapse:collapse;width:100%;margin:8px 0}.mdl th{text-align:left;font-weight:600;color:var(--dim,inherit);padding:3px 6px;border-bottom:1px solid var(--line)}.mdl td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}.mdl select,.mdl input[type=number]{font:13px var(--sans);background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 4px}.mdl .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}.mdl .sum{margin:8px 0;line-height:1.5}.mdl .wr2{color:#c77;font-size:12px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:9px 11px;min-width:0}

.card[data-sndkey].sel{outline:2px solid var(--accent);outline-offset:-1px}
.card h4 i{font:400 12px var(--mono);color:var(--dim);font-style:normal}
.kv{font:12px/1.6 var(--mono);color:var(--dim);word-break:break-word}
.kv b{color:var(--fg);font-weight:500}
.tbl{font:12px/1.55 var(--mono);margin-top:4px;color:var(--fg)}

table.pt td{padding:3px 14px 3px 0}table.pt tr.warn td{color:var(--warn,#e0a030)}

.empty{padding:34px 20px;text-align:center;color:var(--dim)}

.err{color:var(--accent);font-weight:500}

.iet .wd{color:var(--dim);font-size:11.5px}
.iet .hd{color:var(--faint);font-size:11px}
.ieFilt{display:flex;gap:12px;align-items:center;font-size:12.5px;color:var(--dim);grid-column:1/-1}

    <div class="song grow"><b id="songName">Kein Song geladen</b><small id="songSub">Heartbeat-Songdatei von der microSD wählen oder hineinziehen</small></div>
    <button class="btn primary" id="restoreBtn" hidden title="Stellt den zuletzt automatisch gesicherten Stand wieder her"></button>
    <span class="brk" style="flex-basis:100%;height:0"></span>
    <button class="btn" id="saveOpen" disabled>Speichern…</button>
    <button class="btn" id="play" disabled>▶ Abspielen</button>
    <button class="btn" id="stop" disabled>■ Stopp</button>
    <label class="ctl" title="Spielt nur die markierten Schritte (Umschalt+Klick im Lineal) in Dauerschleife. Ohne Markierung: den aktuellen Schritt."><input type="checkbox" id="loopSel"> Schleife</label>
    <span class="pos" id="pos">–</span>
    <label class="ctl" title="Wie viele Schläge ein Takt hat: bestimmt nur die kräftigen Taktlinien. 3 = Dreivierteltakt.">Schläge/Takt <select id="bpb"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option></select></label>
    <label class="ctl">Zeilen/Schlag <select id="rpb"><option>2</option><option>3</option><option selected>4</option><option>6</option><option>8</option></select></label>
    <label class="ctl" title="Aussehen der Oberfläche">Look <select id="theme"><option value="c64">C64 Breadbin</option><option value="c64blue">C64 Blau</option><option value="tracker">Tracker</option><option value="light">Hell</option><option value="dark">Dunkel</option></select></label>
    <label class="ctl">SID <select id="model"><option value="0" selected>6581</option><option value="1">8580</option></select></label>
    <label class="ctl" title="Helligkeit der 6581-Filterkurve (reSID Filter-Bias). Standard 0,7 passt am besten zur Aufnahme vom C64 Ultimate.">Filter dunkel <input type="range" id="bias" min="-50" max="150" value="70"> hell</label>
    <label class="ctl" title="Lautstärkeverhältnis zwischen SID-Stimmen und Samples">Samples <input type="range" id="mix" min="0" max="100" value="50"> SID</label>
    <span class="ctl" id="engineInfo" title="Klangerzeugung">reSID</span>

    <label class="ctl"><input type="checkbox" id="follow" checked> mitlaufen</label>

  <section class="box" id="savePanel" hidden>
    <div class="bar2" style="gap:12px">
      <label class="ctl">Songname <input id="saveSong" maxlength="31" style="font:13px var(--sans);background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:4px;padding:4px 6px;width:18ch"></label>
      <label class="ctl">Dateiname <input id="saveFile" maxlength="60" style="font:13px var(--sans);background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:4px;padding:4px 6px;width:22ch"></label>
      <button class="btn primary" id="saveGo">Als Heartbeat-Song sichern</button>
      <span id="saveMsg" class="note"></span>
    </div>
  </section>

  <section class="box" id="seqBox">
    <div class="bar2" id="seqBar">
      <span class="seg" id="viewSeg" role="tablist" aria-label="Ansicht">
        <button class="btn on" data-m="over" title="Alle Spuren untereinander">Übersicht</button><button class="btn" data-m="roll" title="Die gewählte Spur groß mit Noten (Doppelklick auf eine Spur, Tab-Taste)">Spur-Editor</button><button class="btn" data-m="info">Song</button><button class="btn" data-m="inst">Instrumente</button><button class="btn" data-m="pre">Presets</button><button class="btn" data-m="parts" title="Passagen samt Klängen aufheben und in andere Songs einfügen">Parts</button><button class="btn" data-m="samp">Samples</button><button class="btn" data-m="help">Hilfe</button><button class="btn" data-m="ver" title="Änderungshistorie">Versionen</button>
      </span>
      <span id="seqTools" hidden style="display:contents">
      <b id="seqWhere">Schritt –</b>
      <button class="btn" data-sq="left" title="Schritt nach links schieben">◀</button><button class="btn" data-sq="right" title="Schritt nach rechts schieben">▶</button>
      <button class="btn" data-sq="new" title="Neuen Schritt mit leerem Pattern dahinter einfügen">+ Neues Pattern</button>
      <button class="btn" data-sq="repeat" title="Nur diesen einen Schritt noch einmal dahinter einfügen. Für mehrere: im Lineal markieren und „Auswahl wiederholen“.">1 Schritt wiederholen</button>
      <button class="btn" data-sq="rangeRep" title="Markierte Schritte (Umschalt+Klick im Lineal) noch einmal dahinter einfügen. Ohne Markierung: der aktuelle Schritt.">Auswahl wiederholen</button>
      <button class="btn" data-sq="rangeCopy" title="Markierte Schritte merken">Kopieren</button><button class="btn" data-sq="paste" title="Gemerkte Schritte hinter dem aktuellen Schritt (oder der Markierung) einfügen">Einfügen</button><button class="btn" data-sq="part" title="Markierte Schritte samt Klängen als Part in die Bibliothek legen (Reiter „Parts“)">★ Part</button>
      <button class="btn" data-sq="unique" title="Dieser Schritt bekommt eine eigene Kopie des Patterns">Eigene Kopie</button>

      <input id="markName" class="unm" maxlength="16" placeholder="Abschnitt" style="width:10ch" title="Name für eine Abschnittsmarke an diesem Schritt, zum Beispiel Intro oder Refrain. Leer lassen und ⚑ drücken entfernt die Marke."><button class="btn" data-sq="mark" id="markBtn" title="Marke am aktuellen Schritt setzen, ändern oder (mit leerem Namen) entfernen. Enter im Feld geht auch.">⚑ Marke</button><select id="markJump" title="Zu einer Abschnittsmarke springen"></select>
      <label class="ctl">Pattern <select id="seqPat"></select></label>
      <label class="ctl">Länge <select id="seqLen"></select></label>
      <label class="ctl">Tempo <input id="seqBpm" type="number" min="64" max="319" step="1" style="width:7ch;font:13px var(--sans);background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:4px;padding:3px 5px"> BPM</label>
      <span class="zoomTools"><label class="ctl" title="Breite einer Zeile. Alt+Mausrad zoomt waagerecht, Umschalt+Mausrad schiebt.">Zoom ↔ <input type="range" id="zoom" min="2" max="80" value="7"></label>
      <label class="ctl" id="vzoomLab" title="Höhe der Spuren in der Übersicht"><span id="vzoomTxt">Spurhöhe</span> ↕ <input type="range" id="vzoom" min="16" max="90" value="30"></label><button class="btn" id="fitLanes" title="Alles ins Fenster einpassen">einpassen</button></span>
      </span>
      <span id="seqMsg" class="note"></span>
    </div>
  </section>

      <label class="ctl" id="arpWrap" hidden title="Wie schnell das Arpeggio die Töne wechselt">Arp <select id="arpSpeed"><option value="2">½ Frame</option><option value="4" selected>1 Frame (klassisch)</option><option value="8">2 Frames</option><option value="12">3 Frames</option><option value="16">4 Frames</option></select>
        <select id="arpDir"><option value="up" selected>auf</option><option value="down">ab</option><option value="updown">auf-ab</option></select></label>
      <label class="ctl" id="lenWrap" hidden>Länge <select id="lenSel"><option value="1">1 Zeile</option><option value="2">2 Zeilen</option><option value="4" selected>4 Zeilen</option><option value="8">8 Zeilen</option><option value="16">16 Zeilen</option><option value="0">bis zur nächsten Note</option></select></label>
      <label class="ctl" id="localWrap" hidden title="Kommt ein Pattern mehrfach im Song vor, bekommt diese Stelle beim Bearbeiten automatisch ein eigenes Pattern"><input type="checkbox" id="localEdit" checked> nur diese Stelle</label>
      <span id="selTools" hidden style="display:contents"><label class="ctl" title="Setzt die Länge aller markierten Noten">Auswahl · Länge <select id="selLen"><option value="1">1 Zeile</option><option value="2">2 Zeilen</option><option value="4" selected>4 Zeilen</option><option value="8">8 Zeilen</option><option value="16">16 Zeilen</option><option value="0">bis zur nächsten Note</option></select></label><button class="btn" id="selLenGo" disabled>setzen</button>
      <label class="ctl" title="Raster in Zeilen, auf das die Anschläge gezogen werden">Raster <select id="selGrid"><option value="2">2</option><option value="4" selected>4</option><option value="8">8</option><option value="16">16</option></select></label><button class="btn" id="selQuant" disabled title="Zieht die Anschläge der markierten Noten auf das nächste Raster">Quantisieren</button><button class="btn" id="selPart" disabled title="Markierte Noten samt Klängen als Part in die Bibliothek legen (Reiter „Parts“)">★ Part</button></span>
      <button class="btn" id="undoBtn" disabled title="Rückgängig (Strg+Z)">↶</button><button class="btn" id="redoBtn" disabled title="Wiederholen (Strg+Y)">↷</button>
      <span class="grow"></span><span id="detailInfo"></span></div>
    <div id="detailWrap"><div id="dspacer"></div><canvas id="detail"></canvas></div>
  </section>

  </section>

<script id="hbWorklet" type="text/plain">/* ===== Audio-Thread: reSID (WebAssembly) + Player nach dem Vorbild von Heartbeat + Ultimate-Audio-Samples =====
   Player-Logik nachgebaut nach dem Verhalten von Heartbeat: Tick ca. 197-205 Hz, Zeile = ganze Zahl Ticks,
   Tonhöhe in 1/64-Halbtönen, Tabellen/PWM/Vibrato/Portamento/Filter pro Tick, Hard Restart und Early Gate vor der Zeile. */
const PAL = 985248, C0 = 2, SREF = 3 * 12 + C0, UA = 7, CMD = 31, OVS = 2;   // SREF: Heartbeats C-4 = Originaltempo eines 44,1-kHz-Samples
const CMDS = ['Pa','Bt','Dn','Fi','Iv','Le','Co','Po','Up','Vo','Xt'];
const s8 = v => v > 127 ? v - 256 : v;
const s16 = v => (v & 0x8000) ? (v & 0xFFFF) - 0x10000 : (v & 0xFFFF);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const FREQ = new Uint16Array(8192);
for (let p = 0; p < 8192; p++) FREQ[p] = clamp(Math.round(440 * Math.pow(2, (p / 64 - C0 - 57) / 12) * 16777216 / PAL), 0, 65535);

class HBProc extends AudioWorkletProcessor {
  constructor() {
    super();

    this.tickLen = this.sr / 197; this.tickPos = 0; this.counter = 1; this.tpr = 25;

    if (m.type === 'init') {
      const mod = await WebAssembly.compile(m.wasm);
      const env = {}; for (const i of WebAssembly.Module.imports(mod)) if (i.kind === 'function') env[i.name] = Math[i.name] || (() => 0);
      const inst = await WebAssembly.instantiate(mod, { env });
      this.w = inst.exports; this.w.__wasm_call_ctors();
      this.model = m.model | 0; this.bias = m.bias ?? 0.7; this.chipInit();
      this.ready = true; this.port.postMessage({ type: 'ready' });
    } else if (m.type === 'model') { this.model = m.model | 0; if (this.ready) { this.chipInit(); this.resetChips(); } }
    else if (m.type === 'bias') { this.bias = m.bias; if (this.ready) for (let s = 0; s < 8; s++) this.w.hb_bias(s, this.bias); }
    else if (m.type === 'song') this.loadSong(m);
    else if (m.type === 'inst') { if (this.inst && m.no >= 1 && m.no <= 64) { const d = m.data; this.inst[m.no - 1] = { p: Array.from(d.subarray(16, 32)), wave: Array.from(d.subarray(32, 48)), val: Array.from(d.subarray(48, 64)) }; } }

    else if (m.type === 'loop') { this.loopA = m.a | 0; this.loopB = m.b | 0; }

    else if (m.type === 'stop') this.stop();
    else if (m.type === 'audible') this.audible = new Set(m.list);
    else if (m.type === 'mix') { this.gSid = m.sid; this.gUa = m.ua; }
    else if (m.type === 'previewInst') this.previewInst(m.no, m.note);
    else if (m.type === 'previewSample') this.previewSample(m.no);
    else if (m.type === 'previewData') { const d = m.data; const p = Array.from(d.subarray(16, 32)); this.previewInst(0, m.note, { p, wave: Array.from(d.subarray(32, 48)), val: Array.from(d.subarray(48, 64)) }); }
  }
  chipInit() {
    this.w.hb_init(8, this.model, PAL, this.sr * OVS, 0);
    this.bufs = []; for (let i = 0; i < 8; i++) { this.bufs.push(this.w.hb_buf(i)); this.w.hb_bias(i, this.bias); }
  }

    const d = m.bytes; this.d = d;
    this.inst = []; for (let n = 0; n < 64; n++) { const o = 0xF000 + n * 64; const p = Array.from(d.subarray(o + 16, o + 32));
      this.inst.push({ p, wave: Array.from(d.subarray(o + 32, o + 48)), val: Array.from(d.subarray(o + 48, o + 64)) }); }
    this.smp = []; for (let n = 0; n < 64; n++) { const o = 0xE800 + n * 32, r = i => d[o + i];
      const s = { vol: r(0x10), pan: r(0x11), pitch: s8(r(0x12)), fine: s8(r(0x13)), bank: r(0x15), len: r(0x16) | r(0x17) << 8 | r(0x18) << 16,
        ls: r(0x19) | r(0x1A) << 8 | r(0x1B) << 16, le: r(0x1C) | r(0x1D) << 8 | r(0x1E) << 16, mode: r(0x1F) & 3 };

  newVoice() {

    this.ua = []; for (let c = 0; c < 8; c++) this.ua.push({ s: null, pos: 0, step: 0, end: 0, loop: false, ls: 0, le: 0, gain: 0, pan: 0 });
    this.setTempo((this.tempo0 || 0) + 64);
  }
  setTempo(bpm) {
    this.bpm = bpm; const rowDur = 60 / (bpm * 4);
    this.tpr = Math.max(4, Math.round(200 * rowDur));
    this.tickLen = this.sr * rowDur / this.tpr;
  }
  resetChips() { if (!this.ready) return; for (let s = 0; s < 8; s++) { this.w.hb_reset(s); this.w.hb_write(s, 24, 15); } }
  start(m) {
    this.killT = 0; this.pvKill = 0;
    this.resetState(); this.resetChips();
    this.setTempo(m.bpm); this.row = m.from; this.counter = 1; this.tickPos = this.tickLen; this.firstRow = true; this.playing = true;
  }
  stop() { this.playing = false; if (this.v) { for (let i = 0; i < 24; i++) { const V = this.v[i]; V.mask = 0xFE; V.tCnt = 0; } for (const u of this.ua) u.s = null; } this.killT = Math.round(this.sr * 0.3); this.pvKill = 0; }
  /* völlige Stille: Stimmen abschalten, Chips zurücksetzen (sonst bleibt beim 6581 ein leiser Rest-Ton der laufenden Oszillatoren) */
  silence(only) {
    const list = only === undefined ? [...Array(24).keys()] : [only];
    for (const i of list) { const V = this.v[i]; V.I = null; V.ctrl = 0; V.freq = 0; V.mask = 0xFE; V.tCnt = 0; V.pwSpd = 0; V.vSpd = 0; V.slide = 0; }
    if (only === undefined) this.resetChips();
  }
  isAudible(c) { return this.audible.has(c); }

  nextRow() { const n = this.row + 1; if (this.loopB > this.loopA && n >= this.loopB) return this.loopA; return n >= this.total ? (this.endTo < this.total ? this.endTo : 0) : n; }

  tick() {

      else {

        else if (this.egTime && this.counter === this.egTime) this.earlyGate(this.nextRow());

    }

    for (let vi = 0; vi < 24; vi++) this.voiceTick(vi);
    for (let s = 0; s < 8; s++) if (this.active[s] || s === 7) this.writeChip(s);
  }
  forNext(row, fn) {
    const a = this.rowIdx[row], b = this.rowIdx[row + 1], R = this.rows;
    for (let k = a; k < b; k += 5) {
      const c = R[k], type = R[k + 1], n = R[k + 2], inst = R[k + 3];

  earlyGate(row) { this.forNext(row, (V, inst) => { const I = this.inst[inst - 1]; V.ad = I.p[0]; V.sr = I.p[1]; V.ctrl = this.egWave; V.mask = 0xFF; }); }

  doRow(row) {

  /* ===== WAV-Samples ===== */
  /* WAV lesen: PCM 8/16/24/32 Bit, Float 32/64, auch WAVE_FORMAT_EXTENSIBLE. Mehrkanal wird gemittelt. */
  function parseWav(buf) {
    const d = new Uint8Array(buf), dv = new DataView(buf);
    const str = (o, n) => String.fromCharCode(...d.subarray(o, o + n));
    if (d.length < 12 || str(0, 4) !== 'RIFF' || str(8, 4) !== 'WAVE') throw new Error('Keine WAV-Datei (RIFF/WAVE fehlt).');
    let p = 12, fmt = null, data = null;
    while (p + 8 <= d.length) {
      const id = str(p, 4), sz = dv.getUint32(p + 4, true), body = p + 8;
      if (id === 'fmt ' && body + 16 <= d.length) {
        fmt = { code: dv.getUint16(body, true), ch: dv.getUint16(body + 2, true), rate: dv.getUint32(body + 4, true), bits: dv.getUint16(body + 14, true) };
        if (fmt.code === 0xFFFE && sz >= 26) fmt.code = dv.getUint16(body + 24, true);
      }
      if (id === 'data') data = { o: body, n: Math.min(sz, d.length - body) };
      p = body + sz + (sz & 1);
    }
    if (!fmt || !data) throw new Error('WAV-Datei ohne Format- oder Datenteil.');
    if (!(fmt.code === 1 || fmt.code === 3)) throw new Error('Nur unkomprimierte WAV-Dateien (PCM oder Float) werden unterstützt.');
    if (!fmt.ch || !fmt.rate) throw new Error('WAV-Format ungültig (Kanäle oder Abtastrate fehlen).');
    const bps = fmt.bits >> 3;
    if (!((fmt.code === 1 && [1, 2, 3, 4].includes(bps)) || (fmt.code === 3 && (bps === 4 || bps === 8)))) throw new Error('Bit-Tiefe ' + fmt.bits + ' wird nicht unterstützt.');
    const frame = bps * fmt.ch, n = Math.floor(data.n / frame), mono = new Float32Array(n);
    const one = (o) => {
      if (fmt.code === 3) return bps === 4 ? dv.getFloat32(o, true) : dv.getFloat64(o, true);
      if (bps === 1) return (d[o] - 128) / 128;
      if (bps === 2) return dv.getInt16(o, true) / 32768;
      if (bps === 3) { const v = d[o] | d[o + 1] << 8 | d[o + 2] << 16; return ((v << 8) >> 8) / 8388608; }
      return dv.getInt32(o, true) / 2147483648;
    };
    for (let i = 0; i < n; i++) { let acc = 0; for (let c = 0; c < fmt.ch; c++) acc += one(data.o + i * frame + c * bps); mono[i] = acc / fmt.ch; }
    let out = mono;
    if (fmt.rate !== 44100) {
      const m = Math.max(1, Math.round(n * 44100 / fmt.rate)); out = new Float32Array(m);
      for (let j = 0; j < m; j++) { const pos = j * fmt.rate / 44100, i0 = Math.floor(pos), f = pos - i0, a = mono[Math.min(i0, n - 1)], b = mono[Math.min(i0 + 1, n - 1)]; out[j] = a + (b - a) * f; }
    }
    const pcm = new Uint8Array(out.length * 2), pv = new DataView(pcm.buffer);
    for (let i = 0; i < out.length; i++) pv.setInt16(i * 2, Math.max(-32768, Math.min(32767, Math.round(out[i] * 32767))), true);
    return { pcm, frames: out.length, rate: fmt.rate, ch: fmt.ch, bits: fmt.bits };
  }
  /* Eine WAV-Datei als Sample in den ersten freien Sample-Platz legen (16 Bit, mono, 44,1 kHz, ab nächster freier Bank) */
  async function importWavFile(f, asDrum) {
    let w; try { w = parseWav(await f.arrayBuffer()); } catch (e) { return { err: f.name + ': ' + e.message }; }
    if (!w.frames) return { err: f.name + ': die Datei ist leer.' };
    const slot = S.song.samples.find(x => !x.valid);
    if (!slot) return { err: 'Alle 64 Sample-Plätze sind belegt.' };
    const cur = S.song.bytes, startBank = Math.max(S.song.nextBank || 0, Math.ceil(cur.length / 0x10000));
    const endBank = startBank + Math.ceil(w.pcm.length / 0x10000);
    if (endBank > 255 || w.pcm.length > 0xFFFFFF) return { err: f.name + ': passt nicht mehr hinein. Heartbeat zählt Bänke in einem Byte, also höchstens 255 Bänke (16 MB) insgesamt.' };
    const nb = new Uint8Array(endBank * 0x10000); nb.set(cur);
    nb.set(w.pcm, startBank * 0x10000);
    const e = 0xE800 + (slot.no - 1) * 32;
    nb.fill(0, e, e + 32);
    const name = f.name.replace(/\.wav$/i, '').replace(/[^\x20-\x7E]/g, '_').slice(0, 16);
    for (let i = 0; i < name.length; i++) nb[e + i] = name.charCodeAt(i);
    nb[e + 0x10] = 0x3F; nb[e + 0x11] = 8; nb[e + 0x15] = startBank;

    nb[0xE542] = endBank;

    return { no: slot.no, name, frames: w.frames, rate: w.rate, ch: w.ch, bits: w.bits };
  }

    else { const h = avail(top(scroll)); if (Math.abs(scroll.clientHeight - h) > 2) scroll.style.height = h + 'px';
      if (S.autoLane && S.lanes.length) { LANE_H = Math.max(16, Math.min(90, Math.floor((h - RULER_H - 10) / S.lanes.length))); $('#vzoom').value = LANE_H; } }

  const HELP = `<div class="note" style="max-width:78ch">
  <p><b>Was diese Seite kann:</b> Sie liest einen Heartbeat-Song und zeigt alle 31 Spuren nebeneinander wie in einer DAW. Oben siehst du die Sequencer-Schritte mit ihren Patterns, darunter je Spur die Noten. Ein Klick auf eine Spur öffnet sie unten als große Piano-Roll.</p>
  <p><b>Bedienung:</b> Leertaste oder ▶ spielt ab der türkisen Cursor-Linie. Klick ins Lineal oder in die Piano-Roll setzt den Cursor. Die Felder M und S am Spurnamen schalten eine Spur stumm oder spielen nur diese Spur. Alle Tastenkürzel stehen unten in der Übersicht.</p>
  <p><b>Wie genau der Klang ist:</b> Der SID-Chip wird mit <b>reSID</b> emuliert, wahlweise als 6581 oder 8580. Der Player ist nach dem Verhalten von Heartbeat nachgebaut: Ticks von etwa 197 Hz, Tonhöhe in 1/64-Halbtönen, Wave-Arpeggio-Tabelle, Pulsbreiten-Modulation, Vibrato, Portamento und Filter-Sweep pro Tick, Hard Restart und Early Gate vor jeder Zeile. Filter-Bias und Mischung sind an einer Aufnahme vom C64 Ultimate eingemessen. Samples werden ungeglättet abgespielt. Bei Befehlen sind Up, Dn und Vo noch geschätzt.</p>
  <p><b>reSID:</b> © Dag Lem und Mitwirkende, GNU GPL Version 2 oder später, Quelle: github.com/libsidplayfp/resid. Wenn du diese Seite weitergibst, gilt für den reSID-Teil die GPL.</p>
  <p><b>Arpeggios:</b> Im Bearbeiten-Modus Sound wählen, dann bei „Akkord“ Dur, Moll, Sus4 usw. und darunter Tempo und Richtung. Ein Klick setzt den Grundton, die App baut das passende Arpeggio-Instrument und legt es in einen freien Slot. Gleiche Kombinationen teilen sich einen Slot. In der Piano-Roll siehst du die Akkordtöne blass und den Akkordnamen auf der Note.</p>
  <p><b>Instrumenten-Editor:</b> Im Reiter „Instrumente“ wählst du links einen Slot und änderst rechts Hüllkurve, Klang, Filter und die Wellenform-Tabelle. Alles ist sofort hörbar (▶ Anhören oder normal abspielen) und mit ↶ rückgängig zu machen. „Duplizieren“ kopiert den Klang in den nächsten freien Slot, „.ins sichern“ speichert ihn für Heartbeat.</p>
  <p><b>Instrument-Dateien:</b> Im Reiter „Presets“ lädst du eigene .ins-Dateien aus Heartbeat. Im Reiter „SID-Instrumente“ sicherst du jedes Instrument als .ins (als ZIP), zum Laden in Heartbeat mit C= + O.</p>
  <p><b>Neuer Song:</b> „Neuer Song“ startet aus einer eingebauten leeren Heartbeat-Vorlage. Mit der Leiste über der Zeitleiste baust du den Song-Ablauf: neues Pattern, Wiederholen, eigene Kopie, verschieben, löschen, Pattern-Länge und Tempo. Klänge holst du dir im Reiter „Presets“.</p>
  <p><b>SID importieren:</b> „SID importieren…“ liest eine .sid-Datei ein (zum Beispiel aus dem HVSC), lässt den Player des Komponisten in einer 6502-Nachbildung laufen und schreibt auf, was die drei SID-Stimmen tun. Daraus entstehen Noten, Arpeggios und Instrumente in Heartbeat-Form. Das ist eine Abschrift, keine Rückumwandlung: Rhythmus und Tonhöhen stimmen, die Klänge sind Annäherungen. Der Filter wird übernommen: Routing, Typ und Resonanz je Instrument, der Cutoff-Verlauf als Filter-Hüllkurve im Instrument und, wo nötig, als Co-Befehl in den Spuren. Samples über die Lautstärke und mehrere SID-Chips werden noch nicht übernommen. Liegt das Original neben dem Raster, klingt es ein paar Cent höher. Das steckt als Feinstimmung in den Instrumenten. Läuft ein Player über den CIA-Timer statt 50-mal pro Sekunde (bei manchen Songs), wird die echte Rate gemessen und das Tempo danach gesetzt. Vibrato landet in den Vibrato-Parametern der Instrumente, Triller und Arpeggios im Ausklang als Schleife in der Wellenform-Tabelle, gezogene Töne als Slide-Befehle (Up/Dn) in den Spuren. Wie stark Heartbeat auf dem C64 Ultimate diese Werte genau umsetzt, ist noch nicht am Gerät nachgemessen. Mit dem Feld „Stück“ schaltest du nach dem Import zwischen den Stücken einer Datei um. Die Stücke gehören ihren Komponisten, veröffentliche solche Abschriften bitte nicht.</p>
  <p><b>Zoom:</b> Die Regler stehen in der Leiste über dem Fenster. Im Spur-Editor wird aus „Spurhöhe“ die „Tastenhöhe“. Dort blättert das Mausrad die Tonhöhe hoch und runter, Strg+Mausrad zoomt senkrecht, Alt+Mausrad waagerecht (geht auch in der Übersicht), Umschalt+Mausrad schiebt nach links und rechts, „einpassen“ zeigt wieder alle Noten der Spur.</p>
  <p><b>Ansicht greifen:</b> Statt der Scrollbalken kannst du die Ansicht mit der Maus verschieben: mittlere Maustaste (Rad drücken) gedrückt halten und ziehen, oder die Taste <b>H</b> (wie Hand) halten und mit der linken Taste ziehen. In der Übersicht geht das in alle Richtungen, im Spur-Editor verschiebst du Zeit und Tonhöhe. Solange H gedrückt ist, ändert ein Klick nichts am Song.</p>
  <p><b>Ansichten:</b> Die Leiste oben wechselt zwischen Übersicht (alle Spuren), Spur-Editor (eine Spur groß mit Noten), Song, Instrumente, Presets, Parts, Samples, Hilfe und Versionen. Doppelklick auf eine Spur öffnet den Spur-Editor, die Tab-Taste wechselt zwischen Übersicht und Spur-Editor.</p>
  <p><b>Sicherung:</b> Jede Änderung wird nach etwa einer Sekunde automatisch im Browser gesichert. Nach einem Neuladen oder Absturz bietet die App oben „Letzte Sitzung wiederherstellen“ an. Das ersetzt nicht das Speichern als Datei. Beim Verlassen der Seite mit ungesicherten Änderungen fragt der Browser nach.</p>
  <p><b>Schleife:</b> Der Haken „Schleife“ neben Stopp spielt nur die markierten Schritte (Umschalt+Klick im Lineal) in Dauerschleife, ohne Markierung den aktuellen Schritt. Du kannst dabei weiter Noten ändern.</p>
  <p><b>Töne probehören:</b> Ein Klick (oder Ziehen) auf die Klaviertasten links im Spur-Editor spielt den Ton mit dem gewählten „Sound“.</p>
  <p><b>Länge und Raster:</b> Bei markierten Noten setzt „Auswahl · Länge“ alle Längen auf einmal, „Quantisieren“ zieht die Anschläge auf das gewählte Raster (2, 4, 8 oder 16 Zeilen). Treffen zwei Noten dieselbe Stelle, passiert nichts.</p>
  <p><b>Mehrere Noten markieren (Spur-Editor, Bearbeiten an):</b> In einen freien Bereich klicken und ziehen, es öffnet sich ein Rahmen. Alle berührten Noten sind markiert. Strg+Klick auf eine Note fügt sie hinzu oder nimmt sie heraus, Strg+A markiert alle Noten der Spur. Eine markierte Note ziehen verschiebt die ganze Gruppe (Zeit und Tonhöhe). Entf löscht, Pfeil hoch/runter transponiert (mit Umschalt um eine Oktave), Strg+C, Strg+X und Strg+V kopieren, ausschneiden und fügen an der Cursor-Stelle ein. <b>D</b> dupliziert die markierten Noten (oder die zuletzt angeklickte Note) direkt hinter sich, mit derselben Länge und demselben Klang. Die Kopie ist danach markiert, ein weiteres D hängt die nächste an. Ist dahinter schon etwas belegt, passiert nichts. Umschalt+Klick auf eine markierte Note setzt das gewählte „Sound“ für alle. Esc oder Klick ins Leere hebt die Markierung auf. Alles ist mit Strg+Z rückgängig zu machen, auch über mehrere Patterns hinweg.</p>
  <p><b>Mehrere Schritte kopieren:</b> Im Lineal (Sequencer-Schritte) auf einen Schritt klicken, dann mit Umschalt+Klick auf einen anderen Schritt einen Bereich markieren. „Auswahl wiederholen“ fügt ihn gleich dahinter noch einmal ein, „Kopieren“ und „Einfügen“ setzen ihn an eine andere Stelle, „Schritt löschen“ entfernt den ganzen Bereich. Die Kopien teilen sich die Patterns mit dem Original und verbrauchen keine zusätzlichen Pattern-Plätze. Sobald du in einer Kopie Noten änderst, bekommt diese Stelle (bei „nur diese Stelle“) automatisch ein eigenes Pattern.</p>
  <p><b>Instrumente sehen und ändern:</b> Jeder Klang hat eine feste Farbe (umschaltbar bei „Farbe“). Unter dem Lineal zeigt der Streifen „Instrument“, wo welches Instrument spielt. Maus über einer Note zeigt den Namen. Klick auf eine Note übernimmt ihr Instrument in „Sound“ (im Bearbeiten-Modus). Zum Ändern: oben anderes „Sound“ wählen, dann Umschalt+Klick auf die Note. Beim SID-Import begrenzt „max. Klänge“ die Zahl der Instrumente.</p>
  <p><b>Bearbeiten:</b> Im Spur-Editor „✎ Bearbeiten“ einschalten. Klick ins Leere setzt eine Note. Note ziehen verschiebt sie (Zeit und Tonhöhe), am rechten Rand ziehen ändert die Länge. Rechtsklick oder Alt+Klick (ohne zu ziehen) löscht. Beim Verschieben gilt mit gedrückter Alt-Taste: liegt die Note über einer anderen, fällt ihr vorderer Teil weg; entsteht eine Lücke, wächst die Note davor hinein. Strg+Z macht rückgängig. Mit „nur diese Stelle“ bekommt ein mehrfach genutztes Pattern beim Bearbeiten automatisch eine eigene Kopie, sonst ändert sich jede Stelle.</p>
  <p><b>Speichern:</b> „Speichern…“ legt den Song als ZIP-Datei ab. Darin liegt die Heartbeat-Datei ohne Endung. Entpacken und auf die microSD in den Heartbeat-Ordner kopieren. Die App schreibt nur, was du in ihr änderst (Noten, Ablauf, Klänge, Samples, Songdaten wie Name, Tempo, Hard Restart und Notepad). Alle übrigen Bytes bleiben genau wie in der geladenen Datei. Arbeite trotzdem immer mit einer Kopie deiner Songs.</p>
  <p><b>Parts (Passagen in andere Songs übernehmen):</b> Ein Part ist eine Passage samt ihren Klängen. Markiere im Lineal Schritte (Umschalt+Klick) und drücke „★ Part“ in der Leiste, oder markiere im Spur-Editor Noten einer SID-Spur und drücke dort „★ Part“. Der Part landet im Reiter „Parts“ in der Bibliothek, mit Ordnern wie bei den Presets, und ist auch auf anderen Geräten da. Danach lädst du deinen eigenen Song, setzt den Cursor und drückst beim Part „Einfügen“. Ein Schritt-Part kommt mit neuen Patterns hinter den aktuellen Schritt, ein Noten-Part an die Cursor-Stelle der gewählten SID-Spur. Die Klänge kommen mit: Ist derselbe Klang schon im Song, wird er benutzt, sonst landet er in einem freien Slot. Tempo und Hard Restart des Quellsongs merkt sich der Part. Weichen sie ab, sagt die App Bescheid, auf Wunsch übernimmt sie sie. Sample-Spuren werden nicht mitgenommen. Strg+Z nimmt ein Einfügen ganz zurück, „Parts sichern“ legt alle Parts als Datei ab.</p>
  <p><b>Part vorhören:</b> ▶ auf einer Part-Karte spielt den Part allein in Dauerschleife, mit seinen eigenen Klängen und dem Tempo des Quellsongs. Dein Song bleibt dabei unberührt. ■, Stopp oder die Leertaste beenden das Vorhören.</p>
  <p><b>Abschnittsmarken:</b> In der Leiste über der Zeitleiste einen Namen wie „Intro“ oder „Refrain“ eintippen und „⚑ Marke“ drücken (oder Enter): Die Marke sitzt am aktuellen Schritt und steht im Lineal. „⚑ Springen zu …“ bringt dich hin. Name leeren und ⚑ drücken entfernt sie. Beim Einfügen, Verschieben und Löschen von Schritten wandern die Marken mit. Gespeichert werden sie in den untersten freien Zeilen des Notepads als „@MARKEN 00=Intro;08=Refrain“. Sie gehen also mit der Datei auf den Ultimate und stehen dort im Notepad.</p>
  <p><b>Notepad:</b> Im Reiter „Song“ bearbeitest du das Notepad so, wie Heartbeat es speichert: 25 Zeilen zu je 40 Zeichen. Längere Zeilen und weitere Zeilen werden abgeschnitten.</p>
  <p><b>Grenzen und Prüfung:</b> Oben unter dem Songnamen steht, wie viel belegt ist: Schritte von 255, Patterns von 64 und Klang-Slots von 64. Ein ⚠ zeigt, dass eine Grenze fast erreicht ist. Im Reiter „Song“ prüft die App den Song auf Dinge, die auf dem Ultimate stören: Noten mit leerem Klang-Slot oder fehlendem Sample, ungültige Pattern-Längen, Samples hinter dem Dateiende. Dazu Hinweise wie ungenutzte Klang-Slots und das eingestellte Song-Ende. „zeigen“ springt an die Stelle. Beim Öffnen von „Speichern…“ steht das Ergebnis der Prüfung kurz im Speicherfeld.</p>
  <p><b>Song-Ende:</b> Im Reiter „Song“ stellst du ein, ob der Song auf dem Ultimate am Ende anhält oder in einer Schleife bei einem bestimmten Schritt weiterspielt. Die App spielt dann genauso. Ohne Schleife spielt sie zum Komponieren trotzdem von vorn weiter.</p>

  <p><b>Über dieses Projekt:</b> SID Heartbeat Studio ist eine browserbasierte Erweiterung zum C64-Soundtracker <b>Heartbeat</b> von Trident/Genesis Project. Sie schreibt keine eigene Musikdatei, sondern liest und schreibt echte Heartbeat-Songdateien – die Dateien lassen sich direkt in Heartbeat auf dem <b>C64 Ultimate</b> laden und abspielen, mit allen 8 SIDs (24 SID-Stimmen) und den 7 Ultimate-Audio-Sample-Kanälen. Gedacht ist die Seite als komfortablere, horizontale Ansicht fürs Komponieren am PC – mit Piano-Roll, Maus und Tastatur statt C64-Tastenkombinationen – und nicht als eigenständige DAW: bewusst schlank gehalten, „back to the roots“ wie beim Tracken auf dem echten C64, ohne Live-MIDI-Aufnahme, endlose Spuren oder Mixer. Dazu kommt der Import von .sid-Dateien (zum Beispiel aus dem High Voltage SID Collection-Archiv) und von MIDI-Dateien, beides als Abschrift in Heartbeat-Form zum Weiterbearbeiten.</p>
